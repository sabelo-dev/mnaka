version: 1
# AWS Amplify Hosting publishes the prebuilt browser client committed in dist/.
# Amplify's build image has no Qt or Emscripten, so nothing is compiled here:
# rebuild dist/ locally with packaging/web/stage-web.ps1 and commit it.
frontend:
  phases:
    build:
      commands:
        - test -f dist/index.html
        - test -f dist/mnaka_client.wasm
        - test -f dist/mnaka_client.js
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
customHeaders:
  - pattern: '**'
    headers:
      # 'wasm-unsafe-eval' only permits compiling WebAssembly; Qt injects one inline stylesheet.
      # connect-src lists the Supabase project used for account sign-in.
      - key: Content-Security-Policy
        value: "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://iadmtegtfcmjakrmqxdu.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: no-referrer
      - key: Permissions-Policy
        value: camera=(), microphone=(self), geolocation=()
      - key: Cross-Origin-Opener-Policy
        value: same-origin
      # File names are not content-hashed, so browsers revalidate on every load.
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
