version: 1
# AWS Amplify Hosting publishes the prebuilt browser client committed in dist/.
# Amplify's build image has no Qt or Emscripten, so nothing is compiled here:
# rebuild dist/ locally with packaging/web/stage-web.ps1 and commit it.
frontend:
  phases:
    build:
      commands:
        # The page must name a release whose files are actually present.
        - test -f dist/index.html
        - test -f dist/release.json
        - RELEASE=$(sed -n 's/.*"id":"\([0-9a-f]*\)".*/\1/p' dist/release.json)
        - test -n "$RELEASE"
        - test -f "dist/r/$RELEASE/mnaka_client.wasm"
        - test -f "dist/r/$RELEASE/mnaka_client.js"
        - grep -q "r/$RELEASE/mnaka-boot.js" dist/index.html
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
customHeaders:
  # Files under r/<release>/ never change once published.
  - pattern: '/r/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # The page and the small files beside it name the release, so they are checked on every load.
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: '/*.html'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: '/*.json'
    headers:
      - key: Cache-Control
        value: public, max-age=0, must-revalidate
  - pattern: '**'
    headers:
      # 'wasm-unsafe-eval' only permits compiling WebAssembly; Qt injects one inline stylesheet.
      # connect-src lists the Supabase project used for account sign-in.
      - key: Content-Security-Policy
        value: "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://iadmtegtfcmjakrmqxdu.supabase.co; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - key: Strict-Transport-Security
        value: max-age=31536000
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: no-referrer
      - key: Permissions-Policy
        value: camera=(), microphone=(self), geolocation=()
      - key: Cross-Origin-Opener-Policy
        value: same-origin
