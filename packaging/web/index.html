<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!-- 1:1 mapping between CSS pixels and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#030806">
    <title>MNAKA · AI workspace</title>
    <link rel="icon" type="image/png" href="mnaka-logo.png">
    <!-- Installable on Android (Chrome: menu > Install app / Add to Home screen) and iOS. -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- This page is never cached. Everything under r/__RELEASE__/ belongs to exactly this
         release and is cached for good, so an old page can never load a newer build's files. -->
    <link rel="stylesheet" href="r/__RELEASE__/mnaka-shell.css">
  </head>
  <body>
    <main id="shell">
      <img src="mnaka-logo.png" width="96" height="96" alt="">
      <h1>MNAKA</h1>
      <p id="status" role="status" aria-live="polite">Starting…</p>
      <div id="progress" role="progressbar" aria-label="Download progress" aria-valuemin="0" aria-valuemax="100" hidden><div id="progress-bar"></div></div>
      <button id="retry" type="button" hidden>Try again</button>
      <noscript>MNAKA needs JavaScript and WebAssembly.</noscript>
    </main>
    <div id="screen" hidden></div>
    <script src="r/__RELEASE__/mnaka_client.js"></script>
    <script src="r/__RELEASE__/qtloader.js"></script>
    <script src="r/__RELEASE__/mnaka-boot.js" data-release="__RELEASE__" data-wasm-bytes="__WASM_BYTES__"></script>
  </body>
</html>
