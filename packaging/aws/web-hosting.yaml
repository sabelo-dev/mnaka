AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  MNAKA browser client: a private S3 bucket served through CloudFront.
  Static files only; the stack holds no credentials, API or database.

Parameters:
  DomainName:
    Type: String
    Default: ''
    Description: Optional custom host name, e.g. app.example.com. Leave empty to use the CloudFront domain.
  AcmCertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate for DomainName. It must be in us-east-1. Required when DomainName is set.
  ConnectSources:
    Type: String
    Default: "'self'"
    Description: >-
      CSP connect-src value. Account sign-in needs the Supabase project origin here,
      e.g. 'self' https://<project-ref>.supabase.co
  PriceClass:
    Type: String
    Default: PriceClass_All
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_100 and PriceClass_200 leave out some regions' edge locations.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, '']]

Rules:
  DomainNeedsCertificate:
    RuleCondition: !Not [!Equals [!Ref DomainName, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref AcmCertificateArn, '']]
        AssertDescription: AcmCertificateArn is required when DomainName is set.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReleases
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          # 'wasm-unsafe-eval' only permits compiling WebAssembly. The client links with
          # -sDYNAMIC_EXECUTION=0 so 'unsafe-eval' is not needed. Qt injects one inline
          # stylesheet for its window elements, hence style-src 'unsafe-inline'.
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub >-
              default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline';
              img-src 'self' data: blob:; font-src 'self' data:; connect-src ${ConnectSources};
              base-uri 'none'; form-action 'none'; frame-ancestors 'none'
          ContentTypeOptions:
            Override: true
          FrameOptions:
            Override: true
            FrameOption: DENY
          ReferrerPolicy:
            Override: true
            ReferrerPolicy: no-referrer
          StrictTransportSecurity:
            Override: true
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(self), geolocation=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} MNAKA browser client'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # AWS managed policy "CachingOptimized"; the objects' own Cache-Control sets the edge TTL.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeaders

Outputs:
  BucketName:
    Description: Pass to packaging/aws/deploy-web.ps1 -Bucket.
    Value: !Ref SiteBucket
  DistributionId:
    Description: Pass to packaging/aws/deploy-web.ps1 -DistributionId.
    Value: !Ref Distribution
  SiteUrl:
    Value: !If [HasDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
  DistributionDomainName:
    Description: Point a CNAME or ALIAS record for DomainName at this.
    Value: !GetAtt Distribution.DomainName
